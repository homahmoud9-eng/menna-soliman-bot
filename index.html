<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوت منة سليمان</title><style>body{font-family:Tahoma,Arial;background:#fcf8fc;color:#2d2031;margin:0}header{padding:22px 7%;background:white;border-bottom:1px solid #eadfea;font-size:22px;color:#6e3f6f}main{max-width:760px;margin:25px auto;padding:0 17px}.card{background:white;border:1px solid #eadfea;border-radius:16px;padding:20px;box-shadow:0 4px 16px #5b2a5b0c}h1{font-size:23px;margin:0 0 8px}.note{color:#716674;line-height:1.7}.chat{margin-top:16px;min-height:300px}.msg{padding:12px;margin:10px 0;line-height:1.6;max-width:80%;border-radius:12px}.bot{background:#f6e8f4;margin-left:auto}.me{background:#e7f4ed;margin-right:auto}form{display:flex;gap:8px;border-top:1px solid #eee;padding-top:15px}input{flex:1;border:1px solid #dccfde;border-radius:9px;padding:11px;font:inherit}button,a.btn{border:0;border-radius:9px;background:#6e3f6f;color:white;padding:11px 15px;font:inherit;text-decoration:none;cursor:pointer}.services{display:flex;gap:8px;flex-wrap:wrap}.services button{background:#f3eaf3;color:#583659}.wa{display:none;background:#1ca55b;margin-top:10px}@media(max-width:520px){form{flex-direction:column}}</style></head><body><header>منة سليمان <small>— مساعد خدمة العملاء</small></header><main><div class="card"><h1>أهلاً بيكِ 🌷</h1><p class="note">اختاري الخدمة أو اكتبي طلبك، وسأساعدك فوراً. النسخة دي تجربة عامة وآمنة.</p><div class="services"><button onclick="send('عايزة أحجز استشارة')">استشارة أولية</button><button onclick="send('محتاجة الخدمة المميزة')">الخدمة المميزة</button><button onclick="send('ممكن واتساب؟')">التواصل على واتساب</button></div><div class="chat" id="chat"><div class="msg bot">أنا مساعد منة سليمان. قولي محتاجة أي خدمة؟</div></div><form onsubmit="event.preventDefault();send(inp.value);inp.value=''"><input id="inp" placeholder="اكتبي رسالتك هنا" autofocus><button>إرسال</button></form><a id="wa" class="btn wa" target="_blank" rel="noopener">فتح واتساب</a></div></main><script>const chat=document.getElementById('chat'),inp=document.getElementById('inp'),wa=document.getElementById('wa');let need='';function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.append(d);window.scrollTo(0,document.body.scrollHeight)}function send(t){t=(t||'').trim();if(!t)return;add(t,'me');let r='أهلاً بيكِ 🌷 قولي محتاجة استشارة أولية ولا الخدمة المميزة؟';if(/استشارة|حجز|موعد/.test(t)){need='استشارة أولية';r='خدمة الاستشارة الأولية: جلسة تعريفية لفهم احتياجك وتحديد الخطوة المناسبة. السعر يُحدد بعد التواصل. تحبي تكملي مع الفريق على واتساب؟'}else if(/مميزة|باقة|متابعة/.test(t)){need='الخدمة المميزة';r='الخدمة المميزة مخصصة حسب احتياجك مع متابعة مباشرة. السعر يُحدد بعد التواصل. تحبي تكملي مع الفريق على واتساب؟'}else if(/واتساب|تواصل|موظف|بشري/.test(t)){const nums=['201000000001','201000000002','201000000003'];const n=nums[Number(localStorage.rr||0)%3];localStorage.rr=(Number(localStorage.rr||0)+1)%3;const summary=encodeURIComponent('مرحباً، أنا عميل من رابط منة سليمان. احتياجي: '+(need||'لم يُحدد بعد'));wa.href='https://wa.me/'+n+'?text='+summary;wa.style.display='inline-block';r='تمام، اضغطي زر فتح واتساب. هيظهر للفريق ملخص طلبك تلقائياً.'}setTimeout(()=>add(r,'bot'),350)}</script></body></html>
